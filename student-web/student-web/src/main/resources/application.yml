server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/student_web?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# 注意：JWT 配置必须与 server 同级。
# 之前写在 server 下面，属性名变成 server.jwt.secret，
# 而 JwtUtil 读的是 jwt.secret，导致这里配置根本没生效、实际用的是代码里的默认值。
jwt:
  secret: ${JWT_SECRET:mySecretKeyForStudentManageSystem2026}
  expiration: 7200000
